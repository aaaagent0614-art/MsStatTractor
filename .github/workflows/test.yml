# Run the test suite on Alex's own Windows PC (self-hosted runner "ALEX").
#
# SECURITY: this repo is PUBLIC. A self-hosted runner must never be triggered
# by pull_request / pull_request_target -- a stranger's PR would then execute
# their code on Alex's real machine. Only `push` (needs write access) and
# `workflow_dispatch` (only Alex / maintainers) are allowed here. Do not add
# PR triggers to this file.
#
# The release build stays on GitHub's cloud runners (build-release.yml);
# this job only runs pytest.
name: Test (self-hosted Windows)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # 只用 self-hosted 匹配（只有這一台 runner，不需要更精細的 label）。
    # 加上 alex-pc / windows 這種自訂 label 會因為註冊時沒帶到而永遠 queued。
    runs-on: [self-hosted]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 不用 actions/setup-python：它在這台 self-hosted runner 上會失敗（拿不到
      # log 查明原因）。也不用機器自己的 Python：服務以 SYSTEM 身分執行，看不到
      # 使用者 PATH 的安裝；而且 app 是 PyInstaller 打包的 exe，機器上本來就
      # 不需要 Python。
      #
      # 改成：直接用 python.org 官方 installer 靜默裝到固定路徑，只裝一次。
      # 3.11.9 是 3.11 系列最後一個有 Windows 安裝檔的版本（之後只有 source）。
      # 裝完把路徑寫進 GITHUB_PATH，後面每個 step 直接叫 python 就行。
      - name: Ensure Python 3.11
        shell: powershell
        run: |
          $pyDir = "C:\ci-python311"
          $py    = Join-Path $pyDir "python.exe"
          if (-not (Test-Path $py)) {
            Write-Host "Installing Python 3.11.9 -> $pyDir"
            $url = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe"
            $out = Join-Path $env:TEMP "python-3.11.9-amd64.exe"
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            $installArgs = @(
              "/quiet", "InstallAllUsers=1", "TargetDir=$pyDir",
              "Include_pip=1", "Include_test=0", "Include_launcher=0",
              "Shortcuts=0", "AssociateFiles=0", "PrependPath=0"
            )
            $p = Start-Process -FilePath $out -ArgumentList $installArgs -Wait -PassThru
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            if (-not (Test-Path $py)) { throw "Python install failed (exit=$($p.ExitCode))" }
          } else {
            Write-Host "Python already present at $pyDir (cached)"
          }
          & $py --version
          & $py -m pip --version
          $pyDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Runner info
        shell: powershell
        run: |
          Write-Host "Runner : $env:RUNNER_NAME"
          Write-Host "OS     : $([System.Environment]::OSVersion.VersionString)"
          python --version
          git --version

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        shell: powershell
        run: |
          python -m pytest tests -v --tb=short
